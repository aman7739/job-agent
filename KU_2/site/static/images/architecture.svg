<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Job Digest Agent System Architecture Diagram</title>
  <desc id="arch-desc">Autonomous multi-source ingestion across 8 ATS APIs, normalization, SHA-256 deduplication, 10-point scoring algorithm, and dual-channel delivery with urgent deadline detection.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8px; }
      .box-accent { fill: #1e293b; stroke: #3b82f6; stroke-width: 2; rx: 8px; }
      .box-success { fill: #1e293b; stroke: #10b981; stroke-width: 2; rx: 8px; }
      .box-amber { fill: #1e293b; stroke: #f59e0b; stroke-width: 2; rx: 8px; }
      .title-text { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .header-text { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; }
      .sub-header { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
      .body-text { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; line-height: 1.5; }
      .accent-text { fill: #60a5fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; }
      .badge-text { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
      .badge-bg { fill: rgba(56, 189, 248, 0.15); stroke: #0284c7; stroke-width: 1; rx: 4px; }
      .arrow { stroke: #64748b; stroke-width: 2; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrowhead); }
      .arrow-solid { stroke: #3b82f6; stroke-width: 2; fill: none; marker-end: url(#arrowhead-accent); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" class="bg" rx="12" />

  <!-- Diagram Title -->
  <text x="500" y="38" text-anchor="middle" class="header-text">Job Digest Agent: Autonomous Processing Architecture</text>
  <text x="500" y="58" text-anchor="middle" class="sub-header">End-to-end autonomous discovery, normalization, scoring, and dual delivery pipeline</text>

  <!-- Stage 1: Permitted Sources -->
  <g transform="translate(30, 85)">
    <rect width="170" height="450" class="box" />
    <rect x="12" y="14" width="70" height="20" class="badge-bg" />
    <text x="47" y="28" text-anchor="middle" class="badge-text">STAGE 01</text>
    <text x="14" y="55" class="title-text">8 Sources</text>
    <text x="14" y="73" class="accent-text">Fault-Isolated Pulls</text>

    <!-- Source Items -->
    <g transform="translate(12, 90)">
      <rect width="146" height="34" class="box" rx="6" />
      <text x="10" y="22" class="body-text">Greenhouse API</text>
    </g>
    <g transform="translate(12, 132)">
      <rect width="146" height="34" class="box" rx="6" />
      <text x="10" y="22" class="body-text">Lever API</text>
    </g>
    <g transform="translate(12, 174)">
      <rect width="146" height="34" class="box" rx="6" />
      <text x="10" y="22" class="body-text">Ashby API</text>
    </g>
    <g transform="translate(12, 216)">
      <rect width="146" height="34" class="box" rx="6" />
      <text x="10" y="22" class="body-text">SmartRecruiters</text>
    </g>
    <g transform="translate(12, 258)">
      <rect width="146" height="34" class="box" rx="6" />
      <text x="10" y="22" class="body-text">Workable Widget</text>
    </g>
    <g transform="translate(12, 300)">
      <rect width="146" height="34" class="box" rx="6" />
      <text x="10" y="22" class="body-text">Adzuna Search API</text>
    </g>
    <g transform="translate(12, 342)">
      <rect width="146" height="34" class="box" rx="6" />
      <text x="10" y="22" class="body-text">Remotive API</text>
    </g>
    <g transform="translate(12, 384)">
      <rect width="146" height="34" class="box" rx="6" />
      <text x="10" y="22" class="body-text">IMAP Mailbox A</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <line x1="200" y1="310" x2="225" y2="310" class="arrow-solid" />

  <!-- Stage 2: Normalization -->
  <g transform="translate(230, 85)">
    <rect width="165" height="450" class="box" />
    <rect x="12" y="14" width="70" height="20" class="badge-bg" />
    <text x="47" y="28" text-anchor="middle" class="badge-text">STAGE 02</text>
    <text x="14" y="55" class="title-text">Normalization</text>
    <text x="14" y="73" class="accent-text">Sanitize &amp; Traps</text>

    <g transform="translate(12, 95)">
      <rect width="141" height="65" class="box" rx="6" />
      <text x="10" y="24" class="title-text" font-size="12">HTML Cleaning</text>
      <text x="10" y="44" class="sub-header">Strip tags &amp; spaces</text>
    </g>
    <g transform="translate(12, 175)">
      <rect width="141" height="65" class="box" rx="6" />
      <text x="10" y="24" class="title-text" font-size="12">Location Mapping</text>
      <text x="10" y="44" class="sub-header">Canon Delhi/NCR/BLR</text>
    </g>
    <g transform="translate(12, 255)">
      <rect width="141" height="65" class="box" rx="6" />
      <text x="10" y="24" class="title-text" font-size="12">URL Tracker Clean</text>
      <text x="10" y="44" class="sub-header">Strip UTMs &amp; tokens</text>
    </g>
    <g transform="translate(12, 335)">
      <rect width="141" height="85" class="box" rx="6" />
      <text x="10" y="24" class="title-text" font-size="12">Anti-Trap Regex</text>
      <text x="10" y="44" class="sub-header">Strict word-bound 'C'</text>
      <text x="10" y="62" class="sub-header">Isolated 'Go', 'REST'</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <line x1="395" y1="310" x2="420" y2="310" class="arrow-solid" />

  <!-- Stage 3: Deduplication & Freshness -->
  <g transform="translate(425, 85)">
    <rect width="165" height="450" class="box" />
    <rect x="12" y="14" width="70" height="20" class="badge-bg" />
    <text x="47" y="28" text-anchor="middle" class="badge-text">STAGE 03</text>
    <text x="14" y="55" class="title-text">Deduplication</text>
    <text x="14" y="73" class="accent-text">Fingerprinting</text>

    <g transform="translate(12, 95)">
      <rect width="141" height="85" class="box" rx="6" />
      <text x="10" y="24" class="title-text" font-size="12">Company Suffixes</text>
      <text x="10" y="44" class="sub-header">Normalize Inc/Pvt Ltd</text>
      <text x="10" y="62" class="sub-header">Canonicalize brand</text>
    </g>
    <g transform="translate(12, 195)">
      <rect width="141" height="85" class="box" rx="6" />
      <text x="10" y="24" class="title-text" font-size="12">SHA-256 Hash</text>
      <text x="10" y="44" class="sub-header">Hash(co|title|loc)</text>
      <text x="10" y="62" class="sub-header">Database seen_jobs</text>
    </g>
    <g transform="translate(12, 295)">
      <rect width="141" height="85" class="box" rx="6" />
      <text x="10" y="24" class="title-text" font-size="12">48h Freshness</text>
      <text x="10" y="44" class="sub-header">Cutoff &gt; 48 hours</text>
      <text x="10" y="62" class="sub-header">Drop stale listings</text>
    </g>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <line x1="590" y1="310" x2="615" y2="310" class="arrow-solid" />

  <!-- Stage 4: 10-Point Scoring -->
  <g transform="translate(620, 85)">
    <rect width="165" height="450" class="box-accent" />
    <rect x="12" y="14" width="70" height="20" class="badge-bg" />
    <text x="47" y="28" text-anchor="middle" class="badge-text">STAGE 04</text>
    <text x="14" y="55" class="title-text">10-Point Score</text>
    <text x="14" y="73" class="accent-text">Intern + Fresher</text>

    <g transform="translate(12, 95)">
      <rect width="141" height="65" class="box" rx="6" />
      <text x="10" y="24" class="title-text" font-size="12">Skills (4.0 pts)</text>
      <text x="10" y="44" class="sub-header">Python, FastAPI, SQL</text>
    </g>
    <g transform="translate(12, 170)">
      <rect width="141" height="65" class="box" rx="6" />
      <text x="10" y="24" class="title-text" font-size="12">Role (3.0 pts)</text>
      <text x="10" y="44" class="sub-header">Software / Backend</text>
    </g>
    <g transform="translate(12, 245)">
      <rect width="141" height="65" class="box" rx="6" />
      <text x="10" y="24" class="title-text" font-size="12">Level (2.0 pts)</text>
      <text x="10" y="44" class="sub-header">Intern / 0-yr Fresher</text>
    </g>
    <g transform="translate(12, 320)">
      <rect width="141" height="65" class="box" rx="6" />
      <text x="10" y="24" class="title-text" font-size="12">City (1.0 pt)</text>
      <text x="10" y="44" class="sub-header">NCR, BLR, Pune, Rem</text>
    </g>
    <g transform="translate(12, 395)">
      <text x="70" y="20" text-anchor="middle" class="badge-text" font-size="11">Batch 2027 Target</text>
    </g>
  </g>

  <!-- Flow Arrow 4 -> 5 -->
  <line x1="785" y1="310" x2="810" y2="310" class="arrow-solid" />

  <!-- Stage 5: Delivery & Cadence -->
  <g transform="translate(815, 85)">
    <rect width="155" height="450" class="box-success" />
    <rect x="12" y="14" width="70" height="20" class="badge-bg" />
    <text x="47" y="28" text-anchor="middle" class="badge-text">STAGE 05</text>
    <text x="14" y="55" class="title-text">Delivery</text>
    <text x="14" y="73" class="accent-text">Telegram &amp; Email</text>

    <g transform="translate(10, 95)">
      <rect width="135" height="80" class="box" rx="6" />
      <text x="10" y="22" class="title-text" font-size="12">Twice Daily</text>
      <text x="10" y="40" class="sub-header">08:00 AM IST</text>
      <text x="10" y="58" class="sub-header">07:00 PM IST</text>
    </g>
    <g transform="translate(10, 185)">
      <rect width="135" height="85" class="box-amber" rx="6" />
      <text x="10" y="22" class="title-text" font-size="12" fill="#fbbf24">Urgent Alerts</text>
      <text x="10" y="40" class="sub-header">&#8804; 4 hours deadline</text>
      <text x="10" y="58" class="sub-header">Instant notification</text>
    </g>
    <g transform="translate(10, 280)">
      <rect width="135" height="70" class="box" rx="6" />
      <text x="10" y="22" class="title-text" font-size="12">Telegram Bot</text>
      <text x="10" y="40" class="sub-header">4,096 char safe split</text>
    </g>
    <g transform="translate(10, 360)">
      <rect width="135" height="70" class="box" rx="6" />
      <text x="10" y="22" class="title-text" font-size="12">Web Dashboard</text>
      <text x="10" y="40" class="sub-header">⚡ Run &amp; Notify Now</text>
    </g>
  </g>
</svg>
